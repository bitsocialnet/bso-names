language: en-US
early_access: false
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - master
  path_filters:
    - "!lib/**"
    - "!out/**"
    - "!cache/**"
    - "!broadcast/**"
    - "!test/fixtures/**"
    - "!**/*.lock"
chat:
  auto_reply: true
