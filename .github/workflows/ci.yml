# Builds the registry, checks that it fits under the contract size limit, and runs the tests.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  # The version upstream builds with. Changing it changes the bytecode.
  FOUNDRY_VERSION: v1.5.1

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - name: Format
        run: forge fmt --check src
      # Fails if NameNFT's runtime bytecode exceeds the 24,576-byte limit.
      - name: Build and check contract sizes
        run: forge build --sizes --skip test --skip script
      - name: Test
        run: forge test
